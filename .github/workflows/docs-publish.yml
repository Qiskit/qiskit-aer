name: Docs Publish
on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U virtualenv setuptools wheel tox
        sudo apt-get install graphviz pandoc build-essential libopenblas-dev
    # The Ubuntu images we use have a newer gcc than the ancient version of conan
    # knows about, but it's similar enough that the build still works if we force it.
    #
    # TODO: We should fix the build to use a modern version of conan.  This hack is
    # duplicated in the other Linux CI jobs.
    - name: Hack ancient conan to accept a recent gcc
      run: |
        set -e
        python -m pip install 'conan<2.0.0'
        conan config init --force
        sed -i 's/"14", "14.1"/"14", "14.1", "14.2", "14.3", "15", "15.1", "15.2", "16", "16.1"/' ~/.conan/settings.yml
    - name: Build docs
      env:
        QISKIT_DOCS_BUILD_TUTORIALS: 'always'
      run: tox -edocs
    - name: Bypass Jekyll Processing # Necessary for setting the correct css path
      run: touch docs/_build/html/.nojekyll
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs/_build/html/
