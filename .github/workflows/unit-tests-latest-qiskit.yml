name: Unit Tests for latest Qiskit
on:
  schedule:
    - cron: '0 5 * * *'
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  unit-tests-latest-qiskit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      AER_THRUST_BACKEND: OMP
      QISKIT_TEST_CAPTURE_STREAMS: 1
      # Needed to suppress a warning in jupyter-core 5.x by eagerly migrating to
      # a new internal interface that will be the default in jupyter-core 6.x.
      # This variable should become redundant on release of jupyter-core 6.
      JUPYTER_PLATFORM_DIRS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Set up ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version}}-pip-test-${{ hashFiles('setup.py','requirements-dev.txt','constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version}}-pip-test-
            ${{ runner.os }}-${{ matrix.python-version}}-pip-
            ${{ runner.os }}-${{ matrix.python-version}}-
      - name: Install openblas
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
        shell: bash
      # The Ubuntu images we use have a newer gcc than the ancient version of conan
      # knows about, but it's similar enough that the build still works if we force it.
      #
      # TODO: We should fix the build to use a modern version of conan.  This hack is
      # duplicated in the other Linux CI jobs.
      - name: Hack ancient conan to accept a recent gcc
        run: |
          set -e
          python -m pip install 'conan<2.0.0'
          conan config init --force
          sed -i 's/"14", "14.1"/"14", "14.1", "14.2", "14.3", "15", "15.1", "15.2", "16", "16.1"/' ~/.conan/settings.yml
      - name: Install dependencies and Aer
        run: |
          python -m pip install -U setuptools setuptools-rust wheel
          python -m pip install -U \
            -c constraints.txt \
            -r requirements-dev.txt \
            'git+https://github.com/Qiskit/qiskit.git@main' \
            .
      - name: Run Tests
        run: |
          set -e
          pip check
          rm -rf qiskit_aer
          stestr run --slowest
        shell: bash
