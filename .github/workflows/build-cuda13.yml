name: Build CUDA 13
on:
  push:
    branches: [main, 'stable/*']
  pull_request:
    branches: [main, 'stable/*']
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  # Compile-only check of the qiskit-aer-gpu-cu13 wheel. Runners have no GPU so the wheel tests
  # are skipped. The release build in deploy.yml covers every supported Python version; here only
  # the oldest and newest ones are built to keep the CI time reasonable.
  gpu-build-cuda13:
    name: Build qiskit-aer-gpu-cu13 wheel (CUDA 13, ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["cp311", "cp315"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.13'
      - name: Install cibuildwheel
        run: |
          python -m pip install --group wheel
      - name: Build wheels
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_BEFORE_ALL: "dnf install -y dnf-plugins-core && dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo && rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub && dnf -y install gcc-toolset-12 cuda-toolkit-13-0 openblas-devel && dnf clean all"
          CIBW_BEFORE_BUILD : "pip install nvidia-cuda-runtime nvidia-nvjitlink nvidia-cublas nvidia-cusolver nvidia-cusparse cuquantum-cu13 && bash {project}/tools/wheels/append_bundled_licenses.sh {project}"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_TEST_SKIP: "*"
          # CUDA 13 dropped support for Maxwell, Pascal and Volta (sm_50 - sm_70).
          CIBW_ENVIRONMENT: QISKIT_AER_PACKAGE_NAME=qiskit-aer-gpu-cu13 QISKIT_AER_CUDA_MAJOR=13 CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++ CUDAHOSTCXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++ CMAKE_VERBOSE_MAKEFILE=true AER_THRUST_BACKEND=CUDA CUDACXX=/usr/local/cuda/bin/nvcc AER_CUDA_ARCH="7.5 8.0 8.6 8.7 9.0 10.0 12.0" AER_PYTHON_CUDA_ROOT=/opt/_internal AER_CIBUILD=true
          CIBW_REPAIR_WHEEL_COMMAND: 'auditwheel repair --exclude libcudart.so.13 --exclude libcustatevec.so.1 --exclude libcutensornet.so.2 --exclude libcutensor.so.2 --exclude libcutensorMg.so.2 --exclude libcusolver.so.12 --exclude libcusolverMg.so.12 --exclude libcusparse.so.12 --exclude libcublas.so.13 --exclude libcublasLt.so.13 --exclude libnvJitLink.so.13 -w {dest_dir} {wheel}'
        run: |
          python -m cibuildwheel --output-dir wheelhouse
      - name: Verify bundled licenses
        run: |
          python tools/verify_wheel_licenses.py wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: artifact-gpu-cuda13-${{ matrix.python }}
