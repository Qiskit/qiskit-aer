name: Docs and Tutorial
on:
  push:
    branches: [main, 'stable/*']
  pull_request:
    branches: [main, 'stable/*']
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:

  # This 'finalize' job is a no-op; its sole purpose is to depend on all the other jobs and provide
  # a single in-code determination of whether the branch-protection rules have been passed.  The
  # branch-protection rules in the GitHub web interface can then depend only on this job.
  finalize:
    name: Finalize docs
    runs-on: 'ubuntu-latest'
    # This list should contain every other job in this file.
    needs:
      - docs
      - tutorials
    # This job needs to trigger even if its predecessors failed and return the same status.  By
    # default, GitHub Actions will "skip" the job if a requirement failed, but that counts as a
    # "success" state, which is not acceptable for a branch-protection rule.  We don't use `always`
    # because we don't want `cancelled` to trigger this.
    if: success() || failure()
    steps:
      - run: |
          echo "Successful run."
        if: ${{ !contains(needs.*.result, 'failure') }}
      - run: |
          echo "Predecessor jobs failed.  See GitHub Actions logs." >&2
          exit 1
        if: ${{ contains(needs.*.result, 'failure') }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version}}-pip-docs-${{ hashFiles('setup.py','requirements-dev.txt','constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version}}-pip-docs-
            ${{ runner.os }}-${{ matrix.python-version}}-pip-
            ${{ runner.os }}-${{ matrix.python-version}}-
      - name: Install Deps
        run: |
          set -e
          pip install -U pip virtualenv wheel
          pip install -U tox
          sudo apt-get update
          sudo apt-get install -y build-essential libopenblas-dev pandoc
        shell: bash
      - name: Run Docs Build
        run: tox -edocs
      - uses: actions/upload-artifact@v7
        with:
          name: html_docs
          path: docs/_build/html
  tutorials:
    runs-on: ubuntu-latest
    needs: [docs]
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pip cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-${{ matrix.python-version}}-pip-tutorials-${{ hashFiles('setup.py','requirements-dev.txt','constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version}}-pip-tutorials-
            ${{ runner.os }}-${{ matrix.python-version}}-pip-
            ${{ runner.os }}-${{ matrix.python-version}}-
      - name: Setup tutorials job
        run: |
          set -e
          sudo apt install -y graphviz pandoc libblas-dev liblapack-dev
          git clone https://github.com/Qiskit/qiskit-tutorials --depth=1
          python -m pip install --upgrade pip wheel
          pip install -U -r requirements-dev.txt -c constraints.txt
          pip install -c constraints.txt git+https://github.com/Qiskit/qiskit
          pip install -c constraints.txt .
          pip check
        shell: bash
      - name: Run Tutorials
        run: |
          set -e
          cd qiskit-tutorials
          rm -rf tutorials/circuits tutorials/circuits_advanced tutorials/algorithms tutorials/operators
          sphinx-build -b html . _build/html
      - uses: actions/upload-artifact@v7
        with:
          name: tutorials_html
          path: qiskit-tutorials/_build/html
