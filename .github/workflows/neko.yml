name: Qiskit Neko Integration Tests
on:
  push:
  pull_request:
    branches: ['main', 'stable/*']
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  neko:
    name: Qiskit Neko Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: Qiskit/qiskit-neko@main
        with:
          test_selection: backend
          repo_install_command: |
            sudo apt-get install -y libblas-dev liblapack-dev
            # Hack ancient conan to accept a recent gcc; see tests.yml.
            pip install 'conan<2.0.0'
            conan config init --force
            sed -i 's/"14", "14.1"/"14", "14.1", "14.2", "14.3", "15", "15.1", "15.2", "16", "16.1"/' ~/.conan/settings.yml
            pip uninstall -y qiskit qiskit-aer
            pip install -c constraints.txt .
