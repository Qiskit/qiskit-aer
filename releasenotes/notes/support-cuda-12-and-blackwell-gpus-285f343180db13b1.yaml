---
features:
  - |
    When building with ``AER_THRUST_BACKEND=CUDA``, the build now uses
    ``CMAKE_CUDA_ARCHITECTURES`` if it is set explicitly. Previously the
    architecture was always chosen by CMake's legacy
    ``cuda_select_nvcc_arch_flags`` helper, which does not know GPUs newer than
    Ampere (compute capability 8.6) and selects ``8.6+PTX`` on them. For
    example, ``-DCMAKE_CUDA_ARCHITECTURES=120`` builds natively for Blackwell
    GPUs (compute capability 12.0). Without the option, the architecture is
    still detected automatically.
fixes:
  - |
    Fixed a build failure with CUDA 13, whose Thrust no longer provides
    ``thrust::unary_function``. The GPU kernels now define the
    ``argument_type`` and ``result_type`` typedefs themselves instead of
    deriving from it, which also works with Thrust versions that still provide
    the class. See `issue #2415
    <https://github.com/Qiskit/qiskit-aer/issues/2415>`__.
  - |
    Fixed linking against cuQuantum and cuTENSOR installations that keep their
    libraries directly in ``<root>/lib`` instead of in a CUDA version
    subdirectory such as ``<root>/lib/12``. When ``CUQUANTUM_ROOT`` and
    ``CUTENSOR_ROOT`` are used with ``AER_ENABLE_CUQUANTUM``, ``<root>/lib`` is
    now searched in addition to ``<root>/lib/<CUDA major version>``.
upgrade:
  - |
    Building with CUDA 13 requires the C++17 standard, which CUDA 13's Thrust
    insists on and which is not the default. Pass
    ``-DCMAKE_CXX_STANDARD=17 -DCMAKE_CUDA_STANDARD=17`` when invoking the
    build. Builds with CUDA 12.9 work with the default standard.
