merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: automerge
    merge_method: squash
    batch_size: 1

pull_request_rules:
  - name: automatic merge on CI success and review
    conditions:
      - base=main
      - "#approved-reviews-by>=1"
      - label=automerge
      - label!=on hold
      # GitHub branch-protection rules are automatically applied by mergify, so
      # the queue can't actually merge things unless _all_ statuses are passed.
      # This section is just a sanity check before the PR can enter the main
      # queue.
      - or:
        - check-success=Finalize tests
        - check-neutral=Finalize tests
        - check-skipped=Finalize tests
    actions:
      queue:
        name: automerge
  - name: backport
    conditions:
      - label=stable backport potential
    actions:
      backport:
        branches:
          - stable/0.18
