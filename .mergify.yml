merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: automerge
    merge_conditions: []  # No additional conditions besides branch protection
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base~=^(main|stable/.*)$
      - "#approved-reviews-by>=1"
      - label=automerge
      - label!=on hold

pull_request_rules:
  - name: automatic merge on CI success and review
    conditions: []
    actions:
      queue:
        name: automerge
  - name: backport
    conditions:
      - label=stable backport potential
    actions:
      backport:
        branches:
          - stable/0.18
